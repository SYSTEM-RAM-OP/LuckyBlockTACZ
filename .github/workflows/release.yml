name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.2
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --console=plain

      - name: Show build output
        run: ls -l build/libs

      - name: Resolve tag and version
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          version="${tag#v}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Publish to GitHub Packages
        env:
          MAVEN_PUBLISH_URL: https://maven.pkg.github.com/SYSTEM-RAM-OP/LuckyBlockTACZ
          MAVEN_PUBLISH_VERSION: ${{ steps.refs.outputs.version }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew publish --no-daemon --console=plain

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.refs.outputs.tag }}
          name: ${{ steps.refs.outputs.tag }}
          body_path: .github/release_body.md
          files: build/libs/LuckyBlockTACZ-*.jar
          draft: false
          prerelease: false
