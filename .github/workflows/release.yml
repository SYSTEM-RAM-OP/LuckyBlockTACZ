name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.0.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build with Gradle
        run: ./gradlew build --no-daemon --console=plain

      - name: Show build output
        run: ls -l build/libs

      - name: Resolve tag and version
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="${{ github.event.inputs.tag }}"
          fi
          version="${tag#v}"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.refs.outputs.tag }}
          name: ${{ steps.refs.outputs.tag }}
          body_path: .github/release_body.md
          files: build/libs/LuckyBlockTACZ-*.jar
          draft: false
          prerelease: false

      - name: Publish to Modrinth and CurseForge
        uses: Kir-Antipov/mc-publish@v3.3.2
        with:
          files: build/libs/LuckyBlockTACZ-*.jar
          name: LuckyBlockTACZ ${{ steps.refs.outputs.version }}
          version: ${{ steps.refs.outputs.version }}
          version-type: release
          changelog-file: .github/release_body.md
          loaders: forge
          game-versions: 1.20.1
          java: 17
          modrinth-dependencies: |
            SzzJttH8(required)
            AiwNM9O0(optional)
            3tYsgtNr(optional)
          curseforge-dependencies: |
            1028108(required)
            1382917(optional)
            1273094(optional)

          modrinth-id: J1g7TRaI
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1809662
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
