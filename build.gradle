plugins {
    id 'eclipse'
    id 'net.neoforged.moddev.legacyforge' version '2.0.121'
    id 'maven-publish'
}

repositories.clear()
repositories {
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://neoforged.forgecdn.net/releases" }
    maven { url = "https://neoforged.forgecdn.net/mojang-meta" }
    maven { url = "https://maven.minecraftforge.net/" }
}

version = '1.0.3'
base.archivesName = "LuckyBlockTACZ"

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    version = "1.20.1-47.4.13"

    runs {
        client {
            client()

            def mcreatorJvmOptions = System.getenv('MCREATOR_JVM_OPTIONS')
            if (mcreatorJvmOptions) {
                mcreatorJvmOptions.split("\\s+").findAll { it.trim() }.each { arg ->
                    jvmArgument(arg)
                }
            }
        }
        server {
            server()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        mcreator {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

mixin {
    if (file("src/main/resources/luckyblocktacz.mixins.json").exists()) {
        add sourceSets.main, "luckyblocktacz.refmap.json"
        config "luckyblocktacz.mixins.json"
    }
}

dependencies {
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.5.0"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.5.0"))
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

jar {
    if (file("src/main/resources/luckyblocktacz.mixins.json").exists()) {
        manifest.attributes([
                "MixinConfigs": "luckyblocktacz.mixins.json"
        ])
    }
}

def lootReferenceFile = file('tools/reference-ids.json')
def lootSourceFile = file('src/main/java/net/mcreator/luckyblocktacz/LuckyBlockLoot.java')

tasks.register('validateLootIds') {
    group = 'verification'
    description = 'Checks that every loot id in LuckyBlockLoot.java exists in the installed mods.'

    inputs.file(lootSourceFile)
    inputs.file(lootReferenceFile)

    onlyIf {
        lootReferenceFile.exists() && !providers.gradleProperty('skipLootIdValidation').map { it.toBoolean() }.getOrElse(false)
    }

    doLast {
        def reference = new groovy.json.JsonSlurper().parse(lootReferenceFile)
        def source = lootSourceFile.getText('UTF-8')
        def guns = reference.guns
        def attachments = reference.attachments as List
        def lrtactical = reference.lrtactical
        def deltaMelee = reference.delta_wt_melee as List
        def problems = []

        def each = { String regex, Closure action ->
            def matcher = source =~ regex
            while (matcher.find()) {
                action(matcher)
            }
        }

        def expectedAmmo = { String gunId -> guns[gunId].toString().replaceFirst(/^tacz:/, '') }

        each(/LOOT_TABLE\.add\(gun\("([^"]+)",\s*"([^"]+)"\)\)/) { m ->
            if (!guns.containsKey(m.group(1))) {
                problems << "gun '${m.group(1)}' is not in reference-ids.json"
            } else if (expectedAmmo(m.group(1)) != m.group(2)) {
                problems << "gun '${m.group(1)}' expects ammo '${expectedAmmo(m.group(1))}' but uses '${m.group(2)}'"
            }
        }

        each(/LOOT_TABLE\.add\(gunWithAttachment\("([^"]+)",\s*"([^"]+)",\s*"([^"]+)",\s*\d+\)\)/) { m ->
            if (!guns.containsKey(m.group(1))) {
                problems << "gunWithAttachment gun '${m.group(1)}' is not in reference-ids.json"
            } else if (expectedAmmo(m.group(1)) != m.group(2)) {
                problems << "gunWithAttachment gun '${m.group(1)}' expects ammo '${expectedAmmo(m.group(1))}' but uses '${m.group(2)}'"
            }
            if (!attachments.contains(m.group(3))) {
                problems << "attachment '${m.group(3)}' is not in reference-ids.json"
            }
        }

        each(/LOOT_TABLE\.add\(attachment\("([^"]+)"\)\)/) { m ->
            if (!attachments.contains(m.group(1))) {
                problems << "attachment '${m.group(1)}' is not in reference-ids.json"
            }
        }

        each(/LOOT_TABLE\.add\(consumable\("([^"]+)",\s*\d+\)\)/) { m ->
            if (!(lrtactical.consumable as List).contains(m.group(1))) {
                problems << "consumable '${m.group(1)}' is not in reference-ids.json"
            }
        }

        each(/LOOT_TABLE\.add\(lrMelee\("([^"]+)"\)\)/) { m ->
            if (!(lrtactical.melee as List).contains(m.group(1))) {
                problems << "lrtactical melee '${m.group(1)}' is not in reference-ids.json"
            }
        }

        each(/LOOT_TABLE\.add\(throwable\("([^"]+)"\)\)/) { m ->
            if (!(lrtactical.throwable as List).contains(m.group(1))) {
                problems << "throwable '${m.group(1)}' is not in reference-ids.json"
            }
        }

        each(/LOOT_TABLE\.add\(deltaMelee\("([^"]+)"\)\)/) { m ->
            if (!deltaMelee.contains(m.group(1))) {
                problems << "delta_wt melee '${m.group(1)}' is not in reference-ids.json"
            }
        }

        if (!problems.isEmpty()) {
            throw new GradleException("validateLootIds failed:\n  - " + problems.join("\n  - "))
        }
        logger.lifecycle("validateLootIds: OK (guns=${guns.size()}, attachments=${attachments.size()}, consumables=${(lrtactical.consumable as List).size()})")
    }
}

tasks.named('check') {
    dependsOn 'validateLootIds'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'com.github.SYSTEM-RAM-OP'
            artifactId = 'LuckyBlockTACZ'
            version = System.getenv('MAVEN_PUBLISH_VERSION') ?: System.getenv('VERSION') ?: project.version
            from components.java
        }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = System.getenv('MAVEN_PUBLISH_URL')
            credentials {
                username = System.getenv('GITHUB_ACTOR')
                password = System.getenv('GITHUB_TOKEN')
            }
        }
    }
}

if (file('mcreator.gradle').exists()) {
    apply from: 'mcreator.gradle'
}
